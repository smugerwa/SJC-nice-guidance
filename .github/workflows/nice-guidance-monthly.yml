name: NICE Guidance Monthly Review (manual fallback)

# The monthly schedule now lives on the Hostinger VPS, in the
# sjc-nice-monthly.timer systemd timer. See docs/VPS_HOSTINGER.md.
#
# This workflow is kept for manual runs only, as a fallback when the VPS is
# unavailable. It is deliberately not scheduled, so it cannot double-run
# alongside the VPS timer and create two reports for the same month.
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Optional month to review, for example 'April 2026' or '2026-04'. Leave blank for default."
        required: false
        type: string

jobs:
  monthly-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Write Google OAuth token
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_OAUTH_TOKEN_JSON" ]; then
            echo "Missing GOOGLE_OAUTH_TOKEN_JSON repository secret." >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_OAUTH_TOKEN_JSON" > .google_token.json

      - name: Run NICE guidance review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            python -m nice_guidance_monitor.cli --config config.cloud.json --month "${{ inputs.month }}"
          else
            python -m nice_guidance_monitor.cli --config config.cloud.json
          fi

      - name: Upload generated reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nice-guidance-review-output
          path: outputs/
          if-no-files-found: ignore
